<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><style>
    * {
      box-sizing: border-box;
      margin: 0;
    }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #eef0f4;
      font-family: Pretendard, 'Apple SD Gothic Neo', sans-serif;
      color: #16181d;
      position: relative;
    }
    /* 오른쪽 아래 큰 로고 — 쪽마다 같은 장식, 글자는 쪽마다 다르다 */
    .mark {
      position: absolute;
      right: -90px;
      bottom: -120px;
      width: 520px;
      height: 520px;
      opacity: 0.08;
    }
    .card {
      position: absolute;
      inset: 56px 64px;
      display: flex;
      flex-direction: column;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .brand svg {
      width: 46px;
      height: 46px;
    }
    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
      max-width: 960px;
    }
    .kicker {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 26px;
      font-weight: 600;
      color: #2554eb;
    }
    .chip {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 24px;
      font-weight: 600;
      color: #16181d;
      background: #fff;
      border: 2px solid #d5d9e2;
      border-radius: 10px;
      padding: 4px 14px;
    }
    h1 {
      font-size: 64px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.03em;
      word-break: keep-all;
    }
    h1.long {
      font-size: 54px;
    }
    .sub {
      font-size: 32px;
      line-height: 1.4;
      font-weight: 600;
      color: #4a5160;
      word-break: keep-all;
    }
    .foot {
      font-size: 24px;
      font-weight: 600;
      color: #4a5160;
    }
  </style>
  <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="8" fill="#2554eb" />
  </svg>
  <div class="card">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="8" fill="#2554eb" />
        <path
          d="M10 9h7.5a4.5 4.5 0 0 1 0 9H10zM10 18h8.5a4.5 4.5 0 0 1 0 9H10z"
          fill="none"
          stroke="#fff"
          stroke-width="2.5"
          stroke-linejoin="round"
        /></svg
      >BestOW UI
    </div>
    <div class="body">
      <div class="kicker"><span id="kicker"></span><span class="chip" id="chip" hidden></span></div>
      <h1 id="title"></h1>
      <p class="sub" id="sub" hidden></p>
    </div>
    <div class="foot">bestow-ui.com</div>
  </div>
  <script>
    // generate-og.mjs 가 window.render({ kicker, chip, title, sub }) 로 채운다
    window.render = ({ kicker, chip, title, sub }) => {
      document.getElementById('kicker').textContent = kicker;
      const chipEl = document.getElementById('chip');
      chipEl.hidden = !chip;
      chipEl.textContent = chip ?? '';
      const h1 = document.getElementById('title');
      h1.textContent = title;
      h1.classList.toggle('long', title.length > 22);
      const subEl = document.getElementById('sub');
      subEl.hidden = !sub;
      subEl.textContent = sub ?? '';
    };
  </script>
</html>
