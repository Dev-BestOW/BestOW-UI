name: Release

# main 에 changeset 이 쌓이면 "Version Packages" PR 을 만들고,
# 그 PR 이 머지되면 npm 에 배포한다.
# npm 인증은 토큰 없이 Trusted Publishing(OIDC)으로 한다.
# pnpm 11 의 publish 가 OIDC 토큰 교환을 직접 처리한다 (pnpm 10 은 미지원).
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
