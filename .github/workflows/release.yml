name: Release

# main 에 changeset 이 쌓이면 "Version Packages" PR 을 만들고,
# 그 PR 이 머지되면 npm 에 배포한다.
# npm 인증은 토큰 없이 Trusted Publishing(OIDC)으로 한다.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # npm Trusted Publishing(OIDC)은 npm CLI 11.5.1 이상이 필요하다.
      # pnpm publish 는 내부적으로 npm CLI 를 호출하므로 npm 만 올리면 된다.
      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
