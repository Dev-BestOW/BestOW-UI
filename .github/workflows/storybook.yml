name: Deploy site, Storybook & Playground

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/storybook/**'
      - 'apps/playground/**'
      - 'apps/site/**'
      - 'pnpm-lock.yaml'
      - 'scripts/generate-llms.mjs' # llms-full.txt 생성
      - 'scripts/assemble-pages.sh'
      - '.github/workflows/storybook.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      # 소개 사이트(루트)와 Next.js 예제 앱(/playground/)을 정적 export 한다.
      - id: pages
        uses: actions/configure-pages@v6

      - name: Build site & playground (static export)
        run: |
          pnpm build
          pnpm build-site
          pnpm build-playground
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PLAYGROUND_BASE_PATH: ${{ steps.pages.outputs.base_path }}/playground

      # 루트 = 소개 사이트, /storybook/ = Storybook, /playground/ = 예제 앱, 루트 llms*.txt (scripts/assemble-pages.sh)
      - name: Assemble Pages
        run: bash scripts/assemble-pages.sh pages-dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
