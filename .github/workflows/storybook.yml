name: Deploy Storybook & Playground

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/storybook/**'
      - 'apps/playground/**'
      - 'pnpm-lock.yaml'
      - 'scripts/generate-llms.mjs' # llms-full.txt 생성
      - '.github/workflows/storybook.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      # Next.js 예제 앱을 정적 export 해서 같은 Pages 사이트의 /playground/ 에 넣는다.
      - id: pages
        uses: actions/configure-pages@v6

      - name: Build playground (static export)
        run: |
          pnpm build
          pnpm build-playground
        env:
          NEXT_TELEMETRY_DISABLED: 1
          PLAYGROUND_BASE_PATH: ${{ steps.pages.outputs.base_path }}/playground

      - name: Assemble site
        run: cp -R apps/playground/out apps/storybook/storybook-static/playground

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/storybook/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
