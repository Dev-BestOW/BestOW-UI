name: Deploy site, Storybook & Playground

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/storybook/**'
      - 'apps/playground/**'
      - 'apps/site/**'
      - 'pnpm-lock.yaml'
      - 'scripts/generate-llms.mjs' # llms-full.txt 생성
      - 'scripts/assemble-pages.sh'
      - 'scripts/indexnow.mjs'
      - '.github/workflows/storybook.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      indexnow-urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      # 소개 사이트 /changelog/ 가 배포 날짜를 git 태그에서 읽는다(얕은 기록이면 빌드가 멈춤)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1
          # 방문 통계(Cloudflare Web Analytics) 토큰 — 저장소 Settings › Variables 의 공개 값(비밀 아님). 없으면 통계 없이 배포
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}

      # 소개 사이트(루트)와 Next.js 예제 앱(/playground/)을 정적 export 한다.
      - id: pages
        uses: actions/configure-pages@v6

      - name: Build site & playground (static export)
        run: |
          pnpm build
          pnpm build-site
          pnpm build-playground
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PLAYGROUND_BASE_PATH: ${{ steps.pages.outputs.base_path }}/playground
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}

      # 루트 = 소개 사이트, /storybook/ = Storybook, /playground/ = 예제 앱, 루트 llms*.txt (scripts/assemble-pages.sh)
      - name: Assemble Pages
        run: bash scripts/assemble-pages.sh pages-dist

      # 배포 전에(아직 옛 sitemap 이 떠 있을 때) 새 sitemap 과 비교해 IndexNow 로 알릴 주소를 고른다 — 보내기는 deploy 뒤
      - name: Find changed pages (IndexNow)
        id: indexnow
        run: echo "urls=$(node scripts/indexnow.mjs changed pages-dist/sitemap.xml)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist
          # /.well-known/security.txt — 기본값은 점으로 시작하는 파일·폴더를 뺀다. 다른 숨김 파일은 assemble-pages.sh 가 막는다
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # 바뀐 쪽을 네이버·api.indexnow.org 에 알린다(scripts/indexnow.mjs). 실패해도 경고만 — 배포는 이미 끝났다
      - if: needs.build.outputs.indexnow-urls != '[]'
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/indexnow.mjs
          sparse-checkout-cone-mode: false
      - name: Notify IndexNow
        if: needs.build.outputs.indexnow-urls != '[]'
        run: node scripts/indexnow.mjs submit
        env:
          INDEXNOW_URLS: ${{ needs.build.outputs.indexnow-urls }}
