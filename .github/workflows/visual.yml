name: Visual regression

# 모든 스토리를 라이트·다크로 찍어 기준 이미지(apps/storybook/visual/__screenshots__/linux)와 비교한다.
# 기준 이미지는 OS 마다 렌더링이 달라 항상 이 워크플로의 Docker 이미지에서 만든다.
# - 새 스토리(기준 이미지 없음): 자동으로 찍고 통과. main push 일 때 봇이 커밋한다 (PR 에서는 머지 후 main 에서 커밋).
# - 기존 화면이 바뀜: 실패 → 리포트(visual-report)로 의도한 변경인지 확인 후
#   Actions → Visual regression → Run workflow → 브랜치 선택 + "update" 체크 → 그 브랜치에 봇이 커밋한다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update:
        description: '기준 스크린샷을 새로 만들어 이 브랜치에 커밋'
        type: boolean
        default: false

# 같은 브랜치의 비교 실행은 새 push 가 오면 이전 것을 취소한다.
# 기준 이미지 갱신(update) 실행은 따로 묶어 취소하지 않는다 — 갱신 도중 push 가 와도 끝까지 돌아 커밋하게 한다.
concurrency:
  group: visual-${{ github.ref }}-${{ inputs.update && 'update' || 'compare' }}
  cancel-in-progress: ${{ !inputs.update }}

permissions:
  contents: read

jobs:
  visual:
    name: Storybook screenshots
    runs-on: ubuntu-24.04
    # playwright / @playwright/test 버전(apps/storybook/package.json)과 반드시 같은 태그를 쓴다
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup

      - name: Build packages and Storybook
        run: pnpm build && pnpm build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      # 있는 기준 이미지는 비교하고(다르면 실패), 없는 것(새 스토리)만 새로 찍는다
      - name: Compare screenshots
        if: ${{ !inputs.update }}
        run: pnpm test:visual --update-snapshots=missing

      - name: Commit new baselines (main)
        if: ${{ !inputs.update && github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storybook/visual/__screenshots__/linux
          if git diff --cached --quiet; then
            echo "새 기준 이미지 없음"
            exit 0
          fi
          git commit -m "📸 새 스토리 기준 이미지 추가"
          # 그 사이 main 이 앞서 갔으면(버전 PR 머지 등) 그 위로 옮겨서 push 한다
          git push || (git fetch --unshallow origin main || git fetch origin main; git rebase origin/main && git push)

      - name: Update baselines
        if: ${{ inputs.update }}
        run: |
          rm -rf apps/storybook/visual/__screenshots__/linux
          pnpm test:visual:update

      - name: Commit updated baselines
        if: ${{ inputs.update }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storybook/visual/__screenshots__/linux
          if git diff --cached --quiet; then
            echo "기준 이미지 변경 없음"
          else
            git commit -m "📸 시각 회귀 기준 이미지 갱신"
            # 갱신하는 동안 브랜치가 앞서 갔으면(다른 커밋 push 등) 그 위로 옮겨서 push 한다
            git push || (git fetch --unshallow origin "$GITHUB_REF_NAME" || git fetch origin "$GITHUB_REF_NAME"; git rebase "origin/$GITHUB_REF_NAME" && git push)
          fi

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: |
            apps/storybook/playwright-report
            apps/storybook/test-results
          retention-days: 7
