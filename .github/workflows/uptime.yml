name: Uptime

# 배포된 사이트(https://bestow-ui.com/) 감시 — 주요 쪽 200, 옛 주소·http·www 넘겨주기, 인증서·security.txt 남은 기간.
# 실패하면 GitHub 가 예약 실행을 마지막으로 바꾼 사람에게 메일을 보낸다. 무엇이 실패했는지는 실행 요약(Summary)에 표로 남는다.
# 검사 내용은 scripts/uptime-check.mjs (의존성 없음 — pnpm install 을 하지 않는다).
# 공개 저장소의 예약 실행은 60일 동안 커밋이 없으면 GitHub 가 멈춘다 — 그때는 Actions 화면에서 다시 켠다.
on:
  schedule:
    - cron: '17 */6 * * *' # 6시간마다(UTC, 정각을 피해 붐비는 시간대를 피한다)
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check bestow-ui.com
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/uptime-check.mjs
            .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/uptime-check.mjs
