name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Check generated icons are up to date
        run: |
          pnpm --filter @bestow-ui/icons generate
          git diff --exit-code packages/icons/src/generated || {
            echo "::error::svg/ 와 생성된 아이콘 코드가 다릅니다. 'pnpm --filter @bestow-ui/icons generate' 를 실행하고 커밋하세요."
            exit 1
          }

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build packages
        run: pnpm build

      # 번들 크기 상한(.size-limit.json). Button 하나만 import 했을 때의 크기로 tree-shaking 이 깨지지 않았는지도 본다.
      - name: Bundle size
        run: pnpm size

      - name: Typecheck
        run: pnpm typecheck

      # 커버리지는 보고만 한다 — 실패 기준을 두지 않아 숫자가 낮아져도 CI 는 실패하지 않는다(테스트가 실패하면 실패)
      - name: Test
        run: pnpm test:coverage

  # 브라우저 검사는 브라우저 × (스토리 | E2E) 로 job 을 나눠 나란히 돌린다 — 한 job 에 몰면 WebKit 이 6분 넘게 걸렸다(2026-11-20).
  # Playwright 공식 Docker 이미지에 브라우저와 OS 의존성이 들어 있어 `playwright install --with-deps`(Firefox 2분+)가 필요 없다.
  # 이미지 태그는 playwright·@playwright/test 버전(apps/*/package.json)과 반드시 같아야 한다 — visual.yml 과 함께 올린다.
  # --user 1001: Playwright CI 문서(https://playwright.dev/docs/ci#via-containers)의 GitHub Actions 컨테이너 예시를 따른 것. 문서는 이유를 적지 않았고,
  # root(이미지 기본값)로 돌렸을 때 무엇이 깨지는지는 시험하지 않았다(visual.yml 은 root 로 Chromium 만 돈다).
  # job 이름은 main ruleset 의 필수 검사(.github/rulesets/main.json)다 — 바꾸면 그 파일도 고치고 scripts/apply-repo-settings.sh 를 다시 실행한다.

  # 모든 스토리를 실제 브라우저에서 렌더링하고 play·axe 접근성 검사(a11y.test: 'error')를 라이트·다크로 실행한다.
  # vanilla-extract 가 토큰을 dist 에서 읽으므로 Build packages 다음에 실행해야 한다.
  stories:
    name: Stories (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm build

      - name: Test stories (render + a11y)
        run: pnpm test:stories
        env:
          STORYBOOK_BROWSERS: ${{ matrix.browser }}

      - name: Build Storybook
        if: ${{ matrix.browser == 'chromium' }}
        run: pnpm build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

  # 실제 설치와 같은 조건(dist 사용)으로 Next.js 에서 SSR·서버 컴포넌트 빌드가 되는지 확인하고,
  # 빌드한 playground 와 소개 사이트를 브라우저로 열어 콘솔·hydration 오류, axe(라이트·다크·브랜드), portal 테마, 키보드 시나리오,
  # 옛 주소 넘겨주기를 확인한다.
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm build

      - name: Build playground · site (Next.js)
        run: pnpm build-playground && pnpm build-site
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: E2E (playground · site)
        run: pnpm test:e2e
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.browser }}
          path: |
            apps/playground/playwright-report
            apps/playground/test-results
            apps/site/playwright-report
            apps/site/test-results
          retention-days: 7

  # peerDependency 는 react ^18 || ^19 — react 패키지의 타입 검사·단위 테스트(SSR 스모크 포함)를 React 18 로도 돌린다.
  # 의존성(Radix·icons)까지 React 하나로 맞추려고 pnpm overrides 를 이 job 에서만 붙인다 (두 벌이 섞이면 "Objects are not valid as a React child").
  react18:
    name: React 18
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Use React 18 (pnpm overrides)
        run: |
          # pnpm-workspace.yaml 맨 끝의 overrides 블록에 줄을 더한다(키를 다시 만들면 중복 키 오류)
          printf '  react: 18.3.1\n  react-dom: 18.3.1\n  "@types/react": 18.3.12\n  "@types/react-dom": 18.3.1\n' >> pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          version=$(cd packages/react && node -p "require('react/package.json').version")
          echo "react $version"
          case "$version" in 18.*) ;; *) echo "::error::React 18 이 아닙니다 ($version)"; exit 1 ;; esac

      - name: Build packages
        run: pnpm build

      - name: Typecheck (@types/react 18)
        run: pnpm --filter @bestow-ui/react typecheck

      - name: Test (React 18)
        run: pnpm --filter @bestow-ui/react test
