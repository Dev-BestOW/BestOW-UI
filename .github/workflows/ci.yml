name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Check generated icons are up to date
        run: |
          pnpm --filter @bestow-ui/icons generate
          git diff --exit-code packages/icons/src/generated || {
            echo "::error::svg/ 와 생성된 아이콘 코드가 다릅니다. 'pnpm --filter @bestow-ui/icons generate' 를 실행하고 커밋하세요."
            exit 1
          }

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build packages
        run: pnpm build

      # 번들 크기 상한(.size-limit.json). Button 하나만 import 했을 때의 크기로 tree-shaking 이 깨지지 않았는지도 본다.
      - name: Bundle size
        run: pnpm size

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # 모든 스토리를 실제 브라우저에서 렌더링하고 axe 접근성 검사(a11y.test: 'error')를 실행한다.
      # vanilla-extract 가 토큰을 dist 에서 읽으므로 Build packages 다음에 실행해야 한다.
      - name: Install Playwright Chromium
        run: pnpm --filter @bestow-ui/storybook exec playwright install --with-deps chromium

      - name: Test stories (render + a11y)
        run: pnpm test:stories

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      # 실제 설치와 같은 조건(dist 사용)으로 Next.js 에서 SSR·서버 컴포넌트 빌드가 되는지 확인
      - name: Build playground (Next.js)
        run: pnpm build-playground
        env:
          NEXT_TELEMETRY_DISABLED: 1
