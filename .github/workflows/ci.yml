name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Check generated icons are up to date
        run: |
          pnpm --filter @bestow-ui/icons generate
          git diff --exit-code packages/icons/src/generated || {
            echo "::error::svg/ 와 생성된 아이콘 코드가 다릅니다. 'pnpm --filter @bestow-ui/icons generate' 를 실행하고 커밋하세요."
            exit 1
          }

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build packages
        run: pnpm build

      # 번들 크기 상한(.size-limit.json). Button 하나만 import 했을 때의 크기로 tree-shaking 이 깨지지 않았는지도 본다.
      - name: Bundle size
        run: pnpm size

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # 모든 스토리를 실제 브라우저에서 렌더링하고 axe 접근성 검사(a11y.test: 'error')를 실행한다.
      # vanilla-extract 가 토큰을 dist 에서 읽으므로 Build packages 다음에 실행해야 한다.
      - name: Install Playwright Chromium
        run: pnpm --filter @bestow-ui/storybook exec playwright install --with-deps chromium

      - name: Test stories (render + a11y)
        run: pnpm test:stories

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      # 실제 설치와 같은 조건(dist 사용)으로 Next.js 에서 SSR·서버 컴포넌트 빌드가 되는지 확인
      - name: Build playground (Next.js)
        run: pnpm build-playground
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # 빌드한 playground 를 브라우저로 열어 콘솔·hydration 오류, axe(라이트·다크·브랜드), portal 테마, 키보드 시나리오를 확인한다.
      # Chromium 은 위 "Install Playwright Chromium" 에서 받은 것을 쓴다(같은 Playwright 버전).
      - name: E2E (playground)
        run: pnpm test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/playground/playwright-report
            apps/playground/test-results
          retention-days: 7

  # 같은 스토리 테스트(렌더링 + play + axe)와 playground E2E 를 WebKit(Safari)·Firefox 로도 돌린다.
  # 시각 회귀는 기준 이미지 비용 때문에 Chromium(visual.yml)만. check job 과 나란히 돌아 전체 시간이 늘지 않는다.
  browsers:
    name: Cross-browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm build

      - name: Install Playwright ${{ matrix.browser }}
        run: pnpm --filter @bestow-ui/storybook exec playwright install --with-deps ${{ matrix.browser }}

      - name: Test stories (render + a11y)
        run: pnpm test:stories
        env:
          STORYBOOK_BROWSERS: ${{ matrix.browser }}

      # 스토리 테스트가 실패해도 E2E 까지 돌려, 한 번의 실행으로 두 쪽의 실패 원인(annotation)을 모두 본다
      - name: Build playground (Next.js)
        if: ${{ !cancelled() }}
        run: pnpm build-playground
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: E2E (playground)
        if: ${{ !cancelled() }}
        run: pnpm test:e2e
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.browser }}
          path: |
            apps/playground/playwright-report
            apps/playground/test-results
          retention-days: 7

  # peerDependency 는 react ^18 || ^19 — react 패키지의 타입 검사·단위 테스트(SSR 스모크 포함)를 React 18 로도 돌린다.
  # 의존성(Radix·icons)까지 React 하나로 맞추려고 pnpm overrides 를 이 job 에서만 붙인다 (두 벌이 섞이면 "Objects are not valid as a React child").
  react18:
    name: React 18
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Use React 18 (pnpm overrides)
        run: |
          printf '\noverrides:\n  react: 18.3.1\n  react-dom: 18.3.1\n  "@types/react": 18.3.12\n  "@types/react-dom": 18.3.1\n' >> pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          version=$(cd packages/react && node -p "require('react/package.json').version")
          echo "react $version"
          case "$version" in 18.*) ;; *) echo "::error::React 18 이 아닙니다 ($version)"; exit 1 ;; esac

      - name: Build packages
        run: pnpm build

      - name: Typecheck (@types/react 18)
        run: pnpm --filter @bestow-ui/react typecheck

      - name: Test (React 18)
        run: pnpm --filter @bestow-ui/react test
