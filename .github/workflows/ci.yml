name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Check generated icons are up to date
        run: |
          pnpm --filter @bestow-ui/icons generate
          git diff --exit-code packages/icons/src/generated || {
            echo "::error::svg/ 와 생성된 아이콘 코드가 다릅니다. 'pnpm --filter @bestow-ui/icons generate' 를 실행하고 커밋하세요."
            exit 1
          }

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1
